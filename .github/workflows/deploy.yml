name: Deploy

# Déploiement continu : à chaque fusion dans main, le serveur récupère le code
# et relance les conteneurs. Peut aussi être lancé à la main (onglet Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy        # un seul déploiement à la fois

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le serveur AWS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GH_TOKEN: ${{ github.token }}      # jeton temporaire, valable le temps de la tâche
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "GH_TOKEN='$GH_TOKEN' REPO='$REPO' bash -s" <<'EOF'
          set -e
          cd ~/app
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" main
          git checkout -B deploy FETCH_HEAD
          docker compose -f docker-compose.prod.yml --env-file ~/daar/.env up -d --build
          docker image prune -f
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost/api/stats
          EOF
