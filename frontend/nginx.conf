server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/search -> http://api:8000/search  (le préfixe /api est retiré)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # site Vue (routes côté navigateur : on retombe sur index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
